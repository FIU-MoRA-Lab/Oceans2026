# Configuration for Coupled SWE Advection-Diffusion Simulation

input:
  swe_pickle_path: "swe_data/key_west_result.pkl"
  speed_multiplier: 1.0
  speed_threshold: 0.1

initial_condition:
  central_x: -81.775
  central_y: 24.5
  buffer: 0.009  # ~1000m / 111111 deg/m
  sigma: 2000.0  # meters
  amplitude: 27.0

pde_params:
  diffusivity: 0.1
  t_final_sim: 40000.0
  dt_sim: 5000.0
  mesh_resolution: 30
  element_degree: 1
  element_family: "P"
  are_coordinates_lonlat: true

output:
  output_dir: "coupled_simulations"
  save_pkl_filename: "key_west_simulation_data.pkl"
  create_solution_interpolator: true
